    CAPABILITY_ACTIVATE_WINDOW = 17;

    CAPABILITY_YIELD_TO_USER = 18;

    CAPABILITY_ATTEMPT_LOGIN = 19;

    CAPABILITY_SCROLL_TO = 20;

