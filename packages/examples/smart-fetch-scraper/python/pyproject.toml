[project]
name = "smart-fetch-scraper"
version = "1.0.0"
description = "Stagehand + Browserbase: Smart Fetch Scraper with Fetch API fast-path and browser fallback"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["browserbase>=1.7.0", "pydantic", "python-dotenv", "stagehand==4.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=23.0.0", "ruff>=0.1.0"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
