[project]
name = "extend-browserbase"
version = "0.1.0"
description = "Download expense receipts and parse with Extend AI using Stagehand and Browserbase"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "browserbase>=1.7.0",
  "extend-ai>=1.0.0",
  "python-dotenv>=1.2.1",
  "stagehand==4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=23.0.0", "ruff>=0.1.0"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
