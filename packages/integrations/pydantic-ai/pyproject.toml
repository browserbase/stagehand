[project]
name = "stagehand-pydantic-ai-example"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic-ai>=1.41,<3"]

[project.optional-dependencies]
codemode = [
    "pydantic-ai-harness[codemode]>=0.1,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"agent.py" = ["E501"]
"runner/tests/*" = ["ANN401", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "runner/tests"]
pythonpath = [".", "runner"]
