[project]
name = "stagehand-middleware"
version = "0.1.1"
description = "Stagehand's facade tools (run, snapshot, screenshot) for Python hosts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "stagehand>=4.3.0,<5",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-javascript>=0.25,<0.26",
]
license = "MIT"
authors = [{ name = "Browserbase" }]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stagehand_middleware"

[tool.ruff]
target-version = "py311"
line-length = 100
preview = true

[tool.ruff.lint]
select = ["ANN", "E", "F", "I", "PYI", "UP"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "error"
unsound-return-statement = "error"
dynamic-function-decorator-return = "error"
missing-override-decorator = "error"
unused-ignore-comment = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
strict = true

[dependency-groups]
dev = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "ruff==0.15.7", "ty==0.0.82"]
