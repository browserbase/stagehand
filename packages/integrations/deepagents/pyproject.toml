[project]
name = "stagehand-deepagents"
version = "0.1.0"
description = "Stagehand browser tools for LangChain Deep Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["stagehand>=4.0.0"]

[project.scripts]
stagehand-deepagents-mcp = "stagehand_deepagents.server:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stagehand_deepagents"

[tool.uv.sources]
stagehand = { path = "../../sdk-python", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<1"]
