[project]
name = "stagehand-deepagents-local-example"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "python-dotenv>=1.0",
  "deepagents>=0.7,<1",
  "langchain-mcp-adapters>=0.3,<1",
  "langchain-openai>=1,<2",
  # Requires langgraph-sdk with the authorization fix.
  "langgraph>=1.2.14,<1.3",
  "pydantic>=2,<3",
  # Security minimum for the transitive MCP authentication dependency.
  "pyjwt>=2.15.0,<3",
  # Security minimum for transitive HTTP clients.
  "urllib3>=2.8.0,<3",
]

[tool.uv]
package = false
