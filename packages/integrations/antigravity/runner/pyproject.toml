[project]
name = "stagehand-antigravity-eval-runner"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["google-antigravity>=0.1.20,<0.2"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff==0.15.7"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
