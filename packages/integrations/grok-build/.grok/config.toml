# Grok Build project MCP entry for the Stagehand facade. Adjust the absolute
# path and credentials before copying this file into another project.

[mcp_servers.stagehand]
command = "node"
args = [
  "/absolute/path/to/stagehand/packages/integrations/core/dist/facade/stdio-server.mjs",
  "--max-screenshot-base64-bytes=60000",
]
startup_timeout_sec = 60
tool_timeout_sec = 300

[mcp_servers.stagehand.env]
STAGEHAND_BROWSER = "browserbase"
BROWSERBASE_API_KEY = "bb_live_..."
