name: Upload CTRF report
description: Upload CTRF report artifact.
inputs:
  name:
    description: Report path (used as artifact name when sanitized).
    required: true
  path:
    description: Optional explicit path (defaults to name).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Normalize inputs
      id: normalize
      shell: bash
      # Inputs arrive through env rather than `${{ }}` interpolation: expression results are
      # pasted into the script before bash parses it, so a crafted value would run as code.
      # These names derive from discovered test filenames, which a pull request controls.
      env:
        INPUT_NAME: ${{ inputs.name }}
        INPUT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        echo "name=${INPUT_NAME//\//-}" >> "$GITHUB_OUTPUT"
        if [ -n "$INPUT_PATH" ]; then
          echo "path=$INPUT_PATH" >> "$GITHUB_OUTPUT"
        else
          echo "path=$INPUT_NAME" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload CTRF report artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ steps.normalize.outputs.name }}
        # package.json anchors uploaded paths to the repository root.
        path: |
          package.json
          ${{ steps.normalize.outputs.path }}
