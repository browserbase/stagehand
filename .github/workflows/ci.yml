name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "false"

      - uses: ./.github/actions/setup-chrome-verified
        id: setup-chrome

      - run: pnpm build
      - run: git diff --exit-code -- packages/protocol/stagehand.v4.json
      - run: pnpm check
      - run: pnpm exec vitest run
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Browserbase smoke test
        run: >-
          pnpm exec vitest run --root .
          packages/sdk-ts/tests/browser-runtime/stagehand-browserbase-smoke.test.ts
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_SMOKE: "1"

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "false"

      - uses: ./.github/actions/setup-chrome-verified
        id: setup-chrome

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: packages/sdk-python/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          working-directory: packages/sdk-python
          enable-cache: true
          cache-dependency-glob: packages/sdk-python/uv.lock

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      - run: uv sync --locked --dev
      - run: uv lock --check
      - run: uv run --locked python scripts/generate.py --check
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked ty check
      - run: uv run --locked pytest
      - run: just build
        working-directory: ${{ github.workspace }}
      - name: Smoke test installed Python wheel
        run: >-
          uv run --isolated --no-project
          --with dist/*.whl
          python scripts/smoke.py
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  extension-drift:
    name: Extension drift (Go embed vs server build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: "11.10.0"
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./packages/server build

      # packages/sdk-go/internal/extensionassets/stagehand-extension.zip is committed and
      # go:embed'd, so Go tests and releases use it without ever building the server. Without
      # this gate a change to the extension source ships a stale embedded copy while CI is green.
      - name: Check embedded Go extension matches the built server extension
        run: go run ./internal/extensionpack --check
        working-directory: packages/sdk-go

  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/sdk-go
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-chrome-verified
        id: setup-chrome

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: packages/sdk-go/internal/generator/go.sum

      - run: go -C internal/generator mod download
      - run: go -C internal/generator run . --check
      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -type f))"
      - run: go vet $(go list ./... | grep -v '/examples$')
      - run: go -C internal/generator vet ./...
      - name: Check examples
        run: sh scripts/check-examples.sh
      - run: go test $(go list ./... | grep -v '/examples$')
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - run: go -C internal/generator test ./...
      - run: go build $(go list ./... | grep -v '/examples$')

  go-windows:
    name: Go (Windows process management)
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/sdk-go
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Test Windows process management
        run: >-
          go test
          -run 'TestConfigureChromeProcessUsesDedicatedProcessGroupWindows|TestTaskkillArgsPreserveGracefulThenForcefulShutdown|TestIgnoreFinishedProcessErrorWindows'
          .
