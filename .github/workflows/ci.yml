name: CI

on:
  pull_request:
    branches:
      - v4-go
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - edited
  # The release workflow runs these same checks for pushes before tagging.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run on every maintenance PR, including forks. There are no path filters:
    # protocol, extension, fixtures, and build dependency changes all matter here.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "false"
          restore-turbo-cache: "false"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            packages/sdk-go/go.sum
            packages/sdk-go/internal/generator/go.sum
      - uses: ./.github/actions/setup-chrome-verified
      - name: Check generated protocol
        run: |
          pnpm --filter ./packages/protocol build
          git diff --exit-code -- packages/protocol/stagehand.v4.json
      - name: Check Go models and versions
        run: go -C packages/sdk-go/internal/generator run . --check
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(find packages/sdk-go -name '*.go' -type f -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Check Go unions
        run: pnpm exec vitest run rules/ast-grep/go-union-strictness.test.ts
      - name: Test Go release status
        run: pnpm exec vitest run scripts/release/go-publish-status.test.ts
      - name: Vet, test, and build Go
        working-directory: packages/sdk-go
        shell: bash
        run: |
          packages=$(go list ./... | grep -v '/examples$')
          go vet $packages
          go test $packages
          go build $packages
          go -C internal/generator vet ./...
          go -C internal/generator test ./...
      - name: Check Go examples
        run: sh packages/sdk-go/scripts/check-examples.sh

  extension-drift:
    name: Extension drift (Go embed vs extension build)
    needs: go-checks
    # Preserve the fork gate: only internal heads or safe-to-test PRs build the runtime.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "false"
          restore-turbo-cache: "false"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Build this branch's extension
        run: pnpm --filter ./packages/extension build
      - name: Check the embedded Go runtime
        run: go -C packages/sdk-go run ./internal/extensionpack --check

  go-windows:
    name: Go (Windows process management)
    # Match the existing policy: Windows checks run for internal heads only.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Test Windows process management
        working-directory: packages/sdk-go
        run: >-
          go test
          -run 'TestConfigureChromeProcessUsesDedicatedProcessGroupWindows|TestTaskkillArgsPreserveGracefulThenForcefulShutdown|TestIgnoreFinishedProcessErrorWindows'
          .

  maintenance:
    # Configure this aggregate as the required check for v4-go.
    name: Go maintenance
    needs: [go-checks, extension-drift, go-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required checks passed
        env:
          GO_CHECKS: ${{ needs.go-checks.result }}
          EXTENSION_DRIFT: ${{ needs.extension-drift.result }}
          GO_WINDOWS: ${{ needs.go-windows.result }}
          EXPECTED_WINDOWS: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'success' || 'skipped' }}
        run: |
          test "$GO_CHECKS" = success
          test "$EXTENSION_DRIFT" = success
          test "$GO_WINDOWS" = "$EXPECTED_WINDOWS"
