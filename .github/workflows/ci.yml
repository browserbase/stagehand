name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  # The main-branch approval handoff mirrors an approved external head SHA to an internal branch
  # and dispatches this workflow there. Direct fork heads never execute repository code below.
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Internal mirrored pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine-changes:
    name: Determine changes
    runs-on: ubuntu-latest
    # External contributions are promoted at the maintainer-approved head SHA to an internal PR
    # before CI may check out or execute them. Never trust a persistent label on a mutable fork.
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      integration: ${{ steps.filter.outputs.integration }}
      sdk-ts: ${{ steps.filter.outputs.sdk-ts }}
      sdk-python: ${{ steps.filter.outputs.sdk-python }}
      sdk-go: ${{ steps.filter.outputs.sdk-go }}
    steps:
      - name: Validate approved mirror dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pullNumber = Number(process.env.PULL_REQUEST_NUMBER);
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
              throw new Error('workflow_dispatch requires a valid pull_request_number');
            }

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const expectedRef = `refs/heads/${pull.head.ref}`;
            if (
              pull.state !== 'open' ||
              pull.head.repo?.full_name !== repository ||
              context.ref !== expectedRef ||
              context.sha !== pull.head.sha
            ) {
              throw new Error(
                `Dispatch ref ${context.ref}@${context.sha} does not match open internal PR #${pullNumber}`,
              );
            }

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            integration:
              - 'packages/sdk-ts/**'
              - 'packages/server/**'
              - 'packages/protocol/**'
              - 'scripts/test-integration.ts'
              - 'scripts/test-integration.test.ts'
              - 'scripts/test-utils.ts'
              - 'vitest.integration.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.json'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            sdk-ts:
              - 'packages/sdk-ts/**'
              - 'packages/server/**'
              - 'packages/protocol/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - '.github/**'
            sdk-python:
              - 'packages/sdk-python/**'
              - 'packages/server/**'
              - 'packages/protocol/**'
              - 'pnpm-lock.yaml'
              - '.github/**'
            sdk-go:
              - 'packages/sdk-go/**'
              - 'packages/server/**'
              - 'packages/protocol/**'
              - '.github/**'
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [determine-changes]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "false"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: packages/sdk-python/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          working-directory: packages/sdk-python
          enable-cache: true
          cache-dependency-glob: packages/sdk-python/uv.lock

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: packages/sdk-go/internal/generator/go.sum

      # Keep the legacy build command here so the generated protocol drift check
      # still compares freshly generated output with the committed schema.
      - run: pnpm build
      - run: git diff --exit-code -- packages/protocol/stagehand.v4.json
      - run: pnpm check
      - run: uv lock --check
        working-directory: packages/sdk-python
      - run: uv run --locked python scripts/generate.py --check
        working-directory: packages/sdk-python
      - run: uv run --locked ruff format --check .
        working-directory: packages/sdk-python
      - run: uv run --locked ruff check .
        working-directory: packages/sdk-python
      - run: uv run --locked ty check
        working-directory: packages/sdk-python
      - run: go -C internal/generator mod download
        working-directory: packages/sdk-go
      - run: go -C internal/generator run . --check
        working-directory: packages/sdk-go
      - name: Check Go formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -type f))"
        working-directory: packages/sdk-go
      - run: go vet $(go list ./... | grep -v '/examples$')
        working-directory: packages/sdk-go
      - run: go -C internal/generator vet ./...
        working-directory: packages/sdk-go
      - name: Check Go examples
        run: sh scripts/check-examples.sh
        working-directory: packages/sdk-go

  cancel-after-check-failure:
    name: Cancel after check failure
    runs-on: ubuntu-latest
    # Scoped here rather than workflow-wide: this is the only job that needs to write to the
    # Actions API, and the fan-out means ~60 other jobs would otherwise inherit the privilege.
    permissions:
      contents: read
      actions: write
    needs: [check]
    if: failure()
    continue-on-error: true
    steps:
      - name: Cancel workflow run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSfL -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [determine-changes]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "false"

      - run: pnpm exec turbo run build

      - name: Save Turbo cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml','pnpm-workspace.yaml','package.json','turbo.json') }}-${{ github.sha }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-artifacts
          path: |
            package.json
            packages/protocol/stagehand.v4.json
            packages/server/dist/**
            packages/server/artifacts/**
            packages/sdk-ts/dist/**
            packages/evals/dist/**
          retention-days: 1

  unit-ts:
    name: TypeScript unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, determine-changes]
    if: needs.determine-changes.outputs.sdk-ts == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "true"

      - uses: ./.github/actions/setup-chrome-verified
        id: setup-chrome

      - run: pnpm exec turbo run test:unit
      - run: pnpm exec vitest run
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  browser-ts:
    name: TypeScript browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, determine-changes]
    if: needs.determine-changes.outputs.sdk-ts == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "true"

      - uses: ./.github/actions/setup-chrome-verified
        id: setup-chrome

      - run: pnpm exec turbo run test:browser
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Browserbase smoke test
        run: >-
          pnpm exec vitest run --root .
          packages/sdk-ts/tests/browser-runtime/stagehand-browserbase-smoke.test.ts
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_SMOKE: "1"

  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, determine-changes]
    if: needs.determine-changes.outputs.sdk-python == 'true'
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "true"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: packages/sdk-python/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          working-directory: packages/sdk-python
          enable-cache: true
          cache-dependency-glob: packages/sdk-python/uv.lock

      - run: uv sync --locked --dev
      - run: uv run --locked pytest

  python-wheel-smoke:
    name: Python wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, determine-changes]
    if: needs.determine-changes.outputs.sdk-python == 'true'
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "true"

      - uses: ./.github/actions/setup-chrome-verified
        id: setup-chrome

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: packages/sdk-python/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          working-directory: packages/sdk-python
          enable-cache: true
          cache-dependency-glob: packages/sdk-python/uv.lock

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      - run: just build
        working-directory: ${{ github.workspace }}
      - name: Smoke test installed Python wheel
        run: >-
          uv run --isolated --no-project
          --with dist/*.whl
          python scripts/smoke.py
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  extension-drift:
    name: Extension drift (Go embed vs server build)
    # Same fork gate as go-windows: only an internal branch (including an approved mirror) may
    # install dependencies and build the server.
    if: >-
      needs.determine-changes.outputs.sdk-go == 'true' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, determine-changes]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "true"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache: false

      - run: pnpm --filter ./packages/server build

      # packages/sdk-go/internal/extensionassets/stagehand-extension.zip is committed and
      # go:embed'd, so Go tests and releases use it without ever building the server. Without
      # this gate a change to the extension source ships a stale embedded copy while CI is green.
      - name: Check embedded Go extension matches the built server extension
        run: go run ./internal/extensionpack --check
        working-directory: packages/sdk-go

  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [extension-drift, determine-changes]
    # extension-drift is fork-gated, so it is *skipped* rather than failed on external PRs.
    # A skipped dependency skips its dependents by default, which would silently stop running
    # the Go suite on fork PRs. Run unless the drift check actually failed.
    if: >-
      !cancelled() &&
      needs.extension-drift.result != 'failure' &&
      needs.determine-changes.outputs.sdk-go == 'true'
    defaults:
      run:
        working-directory: packages/sdk-go
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-chrome-verified
        id: setup-chrome

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: packages/sdk-go/internal/generator/go.sum

      - run: go test $(go list ./... | grep -v '/examples$')
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - run: go -C internal/generator test ./...
      - run: go build $(go list ./... | grep -v '/examples$')

  discover-integration:
    name: Discover integration tests
    runs-on: ubuntu-latest
    needs: [determine-changes]
    if: needs.determine-changes.outputs.integration == 'true'
    outputs:
      integration-tests: ${{ steps.set-matrix.outputs.integration-tests }}
      has-integration-tests: ${{ steps.set-matrix.outputs.has-integration-tests }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "false"
          restore-turbo-cache: "false"

      - name: Discover integration tests
        id: set-matrix
        run: |
          integration_json=$(pnpm --silent run test:integration -- --list-groups)
          echo "integration-tests=$integration_json" >> "$GITHUB_OUTPUT"

          if [ "$integration_json" = "[]" ]; then
            echo "has-integration-tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-integration-tests=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Found integration tests: $integration_json"

  integration:
    name: integration/${{ matrix.test.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, discover-integration]
    if: needs.discover-integration.outputs.has-integration-tests == 'true'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        test: ${{ fromJson(needs.discover-integration.outputs.integration-tests) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "true"

      - uses: ./.github/actions/setup-chrome-verified

      - name: Run integration group
        env:
          INTEGRATION_PATHS: ${{ toJson(matrix.test.paths) }}
        run: |
          mapfile -t integration_paths < <(jq -r '.[]' <<< "$INTEGRATION_PATHS")
          pnpm run test:integration -- "${integration_paths[@]}"

      - uses: ./.github/actions/upload-ctrf-report
        if: always()
        with:
          name: ctrf/integration/${{ matrix.test.safe_name }}.json

      - uses: ./.github/actions/upload-v8-coverage
        if: always()
        with:
          name: coverage/integration/${{ matrix.test.safe_name }}

  go-windows:
    name: Go (Windows process management)
    needs: [determine-changes]
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/sdk-go
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Test Windows process management
        run: >-
          go test
          -run 'TestConfigureChromeProcessUsesDedicatedProcessGroupWindows|TestTaskkillArgsPreserveGracefulThenForcefulShutdown|TestIgnoreFinishedProcessErrorWindows'
          .
