name: Publish Python SDK

on:
  workflow_call:
    inputs:
      alpha:
        description: Publish a commit-addressed alpha (`<next>a0.dev<N>`) instead of the checked-in version.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Python distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Alphas number builds by commit count.
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "12.1.0"
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm

      - uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        id: setup-chrome
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: packages/sdk-python/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          working-directory: packages/sdk-python
          enable-cache: true
          cache-dependency-glob: packages/sdk-python/uv.lock

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      - run: just install

      - name: Apply alpha version
        if: inputs.alpha
        run: just _version-python-alpha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build only the extension bundled into the Python package and the Python
      # distributions. Alpha versioning temporarily changes other workspace
      # packages, so the repository-wide build would validate unrelated SDK
      # artifacts against those ephemeral versions.
      - run: pnpm --filter ./packages/extension build
      - run: uv --directory packages/sdk-python run --locked python scripts/build.py

      - name: Read package version
        id: package-version
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("packages/sdk-python/pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Smoke test installed Python wheel
        run: >-
          uv run --isolated --no-project
          --with packages/sdk-python/dist/*.whl
          python packages/sdk-python/scripts/smoke.py
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Smoke test installed Python source distribution
        run: >-
          uv run --isolated --no-project
          --with packages/sdk-python/dist/*.tar.gz
          python -c "from pathlib import Path; import stagehand; assert (Path(stagehand.__file__).parent / '_extension' / 'manifest.json').is_file()"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: packages/sdk-python/dist/*
          if-no-files-found: error

  publish:
    name: Publish Python distributions
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"

      - run: uv publish --trusted-publishing always dist/*

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Tag Python release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="stagehand-python@$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "$TAG already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
