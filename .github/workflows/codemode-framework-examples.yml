name: Code-mode framework examples

on:
  pull_request:
    paths:
      - ".github/workflows/codemode-framework-examples.yml"
      - "packages/integrations/**"
      - "packages/extension/**"
      - "packages/protocol/**"
      - "packages/sdk-ts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  push:
    branches: [main, v4-spike]
    paths:
      - ".github/workflows/codemode-framework-examples.yml"
      - "packages/integrations/**"
      - "packages/extension/**"
      - "packages/protocol/**"
      - "packages/sdk-ts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vercel:
    name: Vercel AI SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "false"

      - uses: ./.github/actions/setup-chrome-verified
        id: setup-chrome

      - run: pnpm exec turbo run build --filter @browserbasehq/stagehand-integrations
      - run: pnpm --filter @browserbasehq/stagehand-integrations-example-vercel typecheck
      - run: pnpm --filter @browserbasehq/stagehand-integrations-example-vercel smoke
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          STAGEHAND_BROWSER: local

  mastra:
    name: Mastra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "false"

      - uses: ./.github/actions/setup-chrome-verified
        id: setup-chrome

      - run: pnpm exec turbo run build --filter @browserbasehq/stagehand-integrations
      - run: pnpm --filter @browserbasehq/stagehand-integrations-example-mastra typecheck
      - run: pnpm --filter @browserbasehq/stagehand-integrations-example-mastra smoke
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          STAGEHAND_BROWSER: local

  crewai:
    name: CrewAI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "false"

      - uses: ./.github/actions/setup-chrome-verified
        id: setup-chrome

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/integrations/examples/crewai/requirements.txt

      - run: pnpm exec turbo run build --filter @browserbasehq/stagehand-integrations
      - run: python -m pip install -r packages/integrations/examples/crewai/requirements.txt
      - run: >-
          python -m py_compile
          packages/integrations/examples/shared/modal_stdio_bridge.py
          packages/integrations/examples/crewai/agent.py
          packages/integrations/examples/crewai/smoke.py
      - run: python packages/integrations/examples/crewai/smoke.py
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          STAGEHAND_BROWSER: local

  langchain:
    name: LangChain Deep Agents
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          use-prebuilt-artifacts: "false"

      - uses: ./.github/actions/setup-chrome-verified
        id: setup-chrome

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/integrations/examples/langchain/requirements.txt

      - run: pnpm exec turbo run build --filter @browserbasehq/stagehand-integrations
      - run: python -m pip install -r packages/integrations/examples/langchain/requirements.txt
      - run: python packages/integrations/examples/langchain/smoke.py
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          STAGEHAND_BROWSER: local
