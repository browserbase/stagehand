name: Browse Windows baseline

# Temporary diagnostic workflow: measure the PR's code before applying Windows fixes.
on:
  pull_request:
    paths:
      - "packages/cli/**"
      - "packages/sdk-ts/**"
      - "packages/extension/**"
      - "packages/protocol/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig*.json"
      - ".github/actions/setup-node-pnpm/**"
      - ".github/workflows/browse-windows-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-baseline:
    name: Browse Windows baseline
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-node-pnpm
        id: setup
        with:
          use-prebuilt-artifacts: "false"
          restore-turbo-cache: "false"

      - name: Record revision and runtime versions
        run: |
          git rev-parse HEAD
          node --version
          pnpm --version

      - name: Build Browse on Windows
        id: build
        timeout-minutes: 10
        run: pnpm exec turbo run build --filter=browse

      - name: Run CLI contracts
        id: cli
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 12
        run: >-
          pnpm --filter browse test:cli
          --reporter=verbose --reporter=json
          --outputFile=reports/windows-cli.json

      # Install Chrome independently of the CLI result, without changing shared setup code.
      - name: Set up Chrome for Testing
        id: chrome
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable

      - name: Verify Chrome launches
        id: verify-chrome
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        timeout-minutes: 2
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            execFileSync(process.env.CHROME_PATH, [
              "--headless=new", "--no-sandbox", "--disable-gpu", "--dump-dom", "about:blank",
            ], { timeout: 30_000, stdio: "inherit" });
          '

      - name: Run real Chrome smoke test
        id: smoke
        if: ${{ !cancelled() && steps.verify-chrome.outcome == 'success' }}
        timeout-minutes: 7
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: >-
          pnpm --filter browse test:smoke
          --reporter=verbose --reporter=json
          --outputFile=reports/windows-smoke.json

      - name: Summarize baseline results
        if: always()
        env:
          TESTED_SHA: ${{ github.sha }}
          SETUP_RESULT: ${{ steps.setup.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          CLI_RESULT: ${{ steps.cli.outcome }}
          CHROME_RESULT: ${{ steps.chrome.outcome }}
          CHROME_LAUNCH_RESULT: ${{ steps.verify-chrome.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        run: |
          @"
          ## Browse Windows baseline
          Revision: $env:TESTED_SHA

          | Check | Outcome |
          | --- | --- |
          | Dependency setup | $env:SETUP_RESULT |
          | Windows build | $env:BUILD_RESULT |
          | CLI contracts | $env:CLI_RESULT |
          | Chrome installation | $env:CHROME_RESULT |
          | Chrome launch | $env:CHROME_LAUNCH_RESULT |
          | Browse Chrome smoke | $env:SMOKE_RESULT |

          See each step's log for errors and the windows-baseline-results artifact for completed test reports.
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-baseline-results
          path: packages/cli/reports/windows-*.json
          if-no-files-found: ignore
          retention-days: 7
